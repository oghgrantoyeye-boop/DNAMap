[project]
name = "dnamap-pipeline"
version = "0.1.0"
description = "Data pipeline: raw AADR + curated research -> validated browser-ready data"
requires-python = ">=3.11"
dependencies = [
  "polars>=1.0",
  "pyarrow>=15",
  "jsonschema>=4.20",
  "pyshp>=3.1.6",
  "pillow>=12.3.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
